<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>FireCut parser test page</title>
<style>
  body { font-family: "Segoe UI", Arial, sans-serif; margin: 24px;
         background: #1a1a1f; color: #eee; }
  h1 { font-size: 1.2em; }
  textarea { width: 100%; height: 260px; font-family: Consolas, monospace;
             font-size: 14px; background: #0e0e12; color: #eee;
             border: 1px solid #444; padding: 8px; }
  button, select { font-size: 15px; padding: 6px 14px; margin: 8px 8px 8px 0; }
  .err  { color: #ff8a80; }
  .warn { color: #ffd180; }
  .ok   { color: #a5d6a7; }
  .fail { color: #ff5252; font-weight: bold; }
  li { margin: 4px 0; }
  #summary { font-size: 1.1em; margin: 12px 0; }
  .media-note { color: #9e9e9e; font-style: italic; }
</style>
</head>
<body>
<h1>FireCut parser and error checker - test page</h1>
<p>
  Pick a fixture or paste a story, then run the checks. Media probing
  uses a real folder relative to this page (fixtures can set their own
  <code>mediaBase</code>, the default is <code>../firecut-demo/media/</code>).
</p>
<select id="fixture"></select>
<button onclick="runAll()">Run all fixtures</button>
<button onclick="runOne()">Check text below</button>
<br>
<textarea id="story" spellcheck="false"></textarea>
<div id="summary"></div>
<ul id="results"></ul>

<script src="../firecut-template/firecut/firecut.js"></script>
<script src="stories.js"></script>
<script>
var sel = document.getElementById('fixture');
var box = document.getElementById('story');
var summary = document.getElementById('summary');
var results = document.getElementById('results');

TEST_STORIES.forEach(function (f, i) {
  var o = document.createElement('option');
  o.value = i; o.textContent = f.name;
  sel.appendChild(o);
});
sel.onchange = function () { box.value = TEST_STORIES[sel.value].text; };
sel.onchange();

function li(cls, text) {
  var e = document.createElement('li');
  e.className = cls; e.textContent = text;
  results.appendChild(e);
}

function has(list, line, sub) {
  for (var i = 0; i < list.length; i++) {
    if (list[i].line === line && list[i].text.indexOf(sub) >= 0) return true;
  }
  return false;
}

function report(out, mediaResults) {
  if (out.errors.length === 0 && out.warnings.length === 0) {
    li('ok', 'No errors and no warnings. The story is clean.');
  }
  out.errors.forEach(function (m) { li('err', 'ERROR: ' + m.text); });
  out.warnings.forEach(function (m) { li('warn', 'warning: ' + m.text); });
  mediaResults.forEach(function (r) {
    var cls = r.status === 'ok' ? 'ok' : 'err';
    var note = r.status === 'unplayable'
      ? ' - file is there but the browser cannot decode it'
      : r.status === 'missing' ? ' - file is missing'
      : r.status === 'badext' ? ' - file type is not supported' : '';
    li(cls, 'media: ' + r.file + ' (line ' + r.line + '): ' + r.status + note);
  });
}

function checkFixture(fix, cb) {
  var out = FireCut.analyse(fix.text);
  var base = fix.mediaBase || '../firecut-demo/media/';
  FireCut.checkMedia(out.model, base, function (mediaResults) {
    var bad = [];
    (fix.errors || []).forEach(function (e) {
      if (!has(out.errors, e.line, e.has)) {
        bad.push('missing error line ' + e.line + ' "' + e.has + '"');
      }
    });
    (fix.warnings || []).forEach(function (e) {
      if (!has(out.warnings, e.line, e.has)) {
        bad.push('missing warning line ' + e.line + ' "' + e.has + '"');
      }
    });
    if (out.errors.length !== (fix.errors || []).length) {
      bad.push('expected ' + (fix.errors || []).length +
               ' errors, got ' + out.errors.length);
    }
    if (out.warnings.length !== (fix.warnings || []).length) {
      bad.push('expected ' + (fix.warnings || []).length +
               ' warnings, got ' + out.warnings.length);
    }
    (fix.media || []).forEach(function (e) {
      var found = false;
      mediaResults.forEach(function (r) {
        if (r.file === e.file && r.status === e.status) { found = true; }
      });
      if (!found) {
        bad.push('media: expected ' + e.file + ' = ' + e.status);
      }
    });
    cb(bad, out, mediaResults);
  });
}

function runAll() {
  results.innerHTML = '';
  var i = 0, pass = 0, fail = 0;
  function next() {
    if (i >= TEST_STORIES.length) {
      summary.textContent = pass + ' passed, ' + fail + ' failed';
      summary.className = fail ? 'fail' : 'ok';
      return;
    }
    var fix = TEST_STORIES[i++];
    checkFixture(fix, function (bad, out, mediaResults) {
      if (bad.length === 0) {
        pass++;
        li('ok', 'PASS  ' + fix.name);
      } else {
        fail++;
        li('fail', 'FAIL  ' + fix.name);
        bad.forEach(function (b) { li('err', '    ' + b); });
        report(out, mediaResults);
      }
      next();
    });
  }
  next();
}

function runOne() {
  results.innerHTML = '';
  var out = FireCut.analyse(box.value);
  summary.textContent = out.errors.length + ' error(s), ' +
                        out.warnings.length + ' warning(s)';
  summary.className = out.errors.length ? 'fail' : 'ok';
  var fix = TEST_STORIES[sel.value];
  var base = (box.value === fix.text && fix.mediaBase)
    ? fix.mediaBase : '../firecut-demo/media/';
  FireCut.checkMedia(out.model, base, function (mediaResults) {
    report(out, mediaResults);
    if (mediaResults.length === 0) {
      li('media-note', 'No media files named in this story to probe.');
    }
  });
}

/* "?auto" in the URL runs every fixture on load, for headless testing. */
if (location.search.indexOf('auto') >= 0) { runAll(); }
</script>
</body>
</html>
